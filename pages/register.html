<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - Sahabat Petani Kerinci</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>  <div class="brand">
  <div class="brand-logo">
  <img src="../logo-sahabat-petani-kerinci.png"
       alt="Logo Sahabat Petani Kerinci">
  

<h2>Daftar Akun</h2>
  
<form id="registerForm">
    <label>Nama lengkap</label><br>
    <input type="text" id="name" required><br><br><label>Email</label><br>
<input type="email" id="email" required><br><br>

<label>Password</label><br>
<input type="password" id="password" minlength="6" required><br><br>

<label>Daftar sebagai</label><br>
<select id="role" required>
  <option value="">Pilih jenis akun</option>
  <option value="buyer">Pembeli</option>
  <option value="seller">Penjual</option>
</select><br><br>

<button type="submit">Daftar</button>

  </form>  <p>Sudah punya akun? <a href="login.html">Masuk</a></p>
<script src="../auth.js"></script>
</body>
</html>
